name: Deploy Astro Site to GitHub Pages

on:
  # Production deploys are manual only (Actions tab -> Run workflow) so that merging or
  # pushing to master can never publish the site without explicit approval.
  # Pull requests run the build + type-check job only; the deploy job is skipped.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run check

      - name: Build static site and Pagefind index
        env:
          PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS || 'false' }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID || 'GTM-5S5WB7M' }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID || 'G-ERJECQ081H' }}
        run: npm run build

      - name: Verify case-sensitive tag redirects and draft gating
        run: |
          test -f dist/blog/tag/Bayes/index.html
          test -f dist/blog/tag/bayes/index.html
          test -f dist/blog/2022/12/08/ai-alignment-for-business-owners.html
          test -f dist/blog/2023/01/21/supply-chain-network-design-python-pulp.html
          test ! -e dist/blog/2026/11/24/migrating-from-jekyll-to-astro.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
